<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Interactive Experiment</title>
    <link rel="stylesheet" href="../assets/site.css" />
  </head>
  <body>
    <main class="page">
      <section class="card" id="app"></section>
    </main>

    <script>
      const sections = [
        {
          title: "Section 1: Prompting and Model Output",
          content:
            "Language models transform input prompts into probable continuations. Explore how changing key words can alter tone and confidence.",
          starter: "The model predicts the next word using learned context.",
        },
        {
          title: "Section 2: Stability Across Prompt Changes",
          content:
            "Small wording differences can shift the output distribution. Try edits that make your sentence more specific or more ambiguous.",
          starter: "Adding constraints can make generated output more focused.",
        },
        {
          title: "Section 3: Trust and Interpretation",
          content:
            "Model outputs can sound confident even when uncertain. Reflect on when explanation quality should increase or reduce trust.",
          starter: "A confident answer is not always a correct answer.",
        },
      ];

      let idx = 0;
      let hasUpdated = false;
      let responses = Array(sections.length).fill("");
      let completed = false;
      const completionToken = Math.random().toString(36).slice(2, 12).toUpperCase();

      const app = document.getElementById("app");

      function progressPct() {
        return ((idx + 1) / sections.length) * 100;
      }

      function transformText(text) {
        const words = text.trim().split(/\s+/).filter(Boolean);
        if (!words.length) return "Please type a sentence first.";
        const emphasized = words.map((w, i) => (i % 3 === 0 ? w.toUpperCase() : w)).join(" ");
        return `Updated output: ${emphasized}.`;
      }

      function render() {
        if (completed) {
          app.innerHTML = `
            <h1>Thank you!</h1>
            <p class="subtitle">Your completion code:</p>
            <p><code>${completionToken}</code></p>
            <p class="footer-note">No responses were transmitted or stored.</p>
            <div class="actions"><a href="../" class="route-link">Back to home</a></div>
          `;
          return;
        }

        const section = sections[idx];
        const canContinue = responses[idx].trim().length > 0 && hasUpdated;
        const isLast = idx === sections.length - 1;

        app.innerHTML = `
          <h1>Interactive Experiment</h1>
          <div class="progress"><div style="width:${progressPct()}%"></div></div>
          <div class="row"><span>Section ${idx + 1} of ${sections.length}</span><span>No data saved</span></div>

          <h2 class="section-title">${section.title}</h2>
          <p class="section-content">${section.content}</p>

          <div class="notice">This route requires at least one "Update" click before continuing.</div>

          <div class="interactive-box">
            <label for="sentence">Edit this sentence and click Update:</label>
            <input id="sentence" type="text" value="${section.starter.replace(/"/g, "&quot;")}" />
            <div class="actions">
              <button class="secondary" id="updateBtn">Update</button>
            </div>
            <div id="result" class="result">No update yet for this section.</div>
          </div>

          <label for="response"><strong>${isLast ? "What did you think overall?" : "What did you learn from this section?"}</strong></label>
          <textarea id="response" placeholder="Share your thoughts...">${responses[idx]}</textarea>
          ${responses[idx].trim() ? "" : '<div class="warning">Please write something before continuing.</div>'}
          ${hasUpdated ? "" : '<div class="warning">Please click Update at least once before continuing.</div>'}

          <div class="actions">
            <button class="primary" id="nextBtn" ${canContinue ? "" : "disabled"}>
              ${isLast ? "Submit & Finish" : "Continue"}
            </button>
          </div>
        `;

        const sentenceEl = document.getElementById("sentence");
        const responseEl = document.getElementById("response");
        const resultEl = document.getElementById("result");
        const updateBtn = document.getElementById("updateBtn");
        const nextBtn = document.getElementById("nextBtn");

        responseEl.addEventListener("input", () => {
          responses[idx] = responseEl.value;
          render();
        });

        updateBtn.addEventListener("click", () => {
          resultEl.textContent = transformText(sentenceEl.value);
          hasUpdated = true;
          render();
        });

        nextBtn.addEventListener("click", () => {
          if (!canContinue) return;
          if (isLast) {
            completed = true;
          } else {
            idx += 1;
            hasUpdated = false;
          }
          render();
          window.scrollTo({ top: 0, behavior: "smooth" });
        });
      }

      render();
    </script>
  </body>
</html>
